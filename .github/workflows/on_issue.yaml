name: CI (issue or PR)

on:
  # Runs when a new issue is opened.
  issues:
    types:
      - opened
  # Runs when a new PR is opened. pull_request_target so the token has write access for PRs from forks; no code is checked out here.
  pull_request_target:
    types:
      - opened

permissions:
  contents: read

jobs:
  label_issues:
    name: Add labels
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      # Add the "t-tooling" label to all new issues and PRs
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ["t-tooling"]
            })

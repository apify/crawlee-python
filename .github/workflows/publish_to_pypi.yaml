name: Publish to PyPI

on:
  # Dispatched from `manual_release_beta.yaml` and `manual_release_stable.yaml` via the `apify/actions/execute-workflow`
  # action. All releases are published from this single workflow, which is the one registered as the PyPI Trusted
  # Publisher, so PyPI attests the same provenance for beta and stable releases. It is a standalone workflow, not
  # a reusable one, because PyPI's Trusted Publishing does not currently support reusable workflows.
  # See: https://docs.pypi.org/trusted-publishers/troubleshooting/#reusable-workflows-on-github
  workflow_dispatch:
    inputs:
      version_number:
        description: Version to publish (for a prerelease, the base version the beta number is appended to)
        required: true
        type: string
      ref:
        description: Git ref to build the package from (branch, tag, or commit SHA)
        required: true
        type: string
      is_prerelease:
        description: Whether to publish a beta prerelease
        required: false
        type: boolean
        default: false

concurrency:
  group: publish-to-pypi
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Runs without `id-token: write`, so the build (the composite actions and the project's dev dependencies) can't
  # request a PyPI token. Only the `pypi_publish` job below can.
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Also pins the ref to a commit, so the checked commit is the one that gets built.
      - name: Check that the ref is on a release branch
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$REF" --jq .sha)
          branches=$(gh api --paginate "repos/$GITHUB_REPOSITORY/branches" --jq '.[].name' | grep -E '^(master|release-v.+)$')
          for branch in $branches; do
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$branch...$sha" --jq .status || true)
            if [[ "$status" == "identical" || "$status" == "behind" ]]; then
              echo "sha=$sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::$sha is not on a release branch"
          exit 1

      - name: Prepare distribution
        uses: apify/actions/prepare-pypi-distribution@v1.9.0
        with:
          package_name: crawlee
          is_prerelease: ${{ inputs.is_prerelease && 'yes' || '' }}
          version_number: ${{ inputs.version_number }}
          ref: ${{ steps.ref.outputs.sha }}

      - name: Verify built package
        uses: apify/actions/python-package-check@v1.9.0
        with:
          package_name: crawlee
          dist_dir: dist
          python_version: "3.14"
          extras: all
          smoke_code: |
            from crawlee.crawlers import (
                HttpCrawler, BeautifulSoupCrawler, ParselCrawler,
                PlaywrightCrawler, AdaptivePlaywrightCrawler,
            )
            from crawlee.storages import Dataset, KeyValueStore, RequestQueue
            from crawlee.http_clients import HttpxHttpClient, ImpitHttpClient
            from crawlee import Request
            HttpCrawler()
            BeautifulSoupCrawler()
            ParselCrawler()

      - name: Upload distribution
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  pypi_publish:
    name: PyPI publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC authentication.
    environment:
      name: pypi
      url: https://pypi.org/project/crawlee
    steps:
      - name: Download distribution
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/

      # Publish the package to PyPI using PyPA official GitHub action with OIDC authentication.
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

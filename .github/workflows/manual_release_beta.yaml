name: Beta release

on:
  # Runs when manually triggered from the GitHub UI, or dispatched from `on_master.yaml`
  # via the `apify/actions/execute-workflow` action for the automatic beta release on push to master.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  wait_for_checks:
    # Gate the release on the `Checks` workflow already succeeding on this commit (run by `on_master.yaml`).
    name: Wait for required checks
    runs-on: ubuntu-latest
    permissions:
      checks: read
    steps:
      - name: Wait for checks
        uses: apify/actions/wait-for-checks@v1.6.2
        with:
          ref: ${{ github.sha }}
          check-regexp: ^Checks

  release_prepare:
    name: Release prepare
    needs: [wait_for_checks]
    runs-on: ubuntu-latest
    outputs:
      version_number: ${{ steps.release_prepare.outputs.version_number }}
      changelog_artifact_name: ${{ steps.release_prepare.outputs.changelog_artifact_name }}
    steps:
      - uses: apify/actions/git-cliff-release@v1.6.2
        id: release_prepare
        name: Release prepare
        with:
          release_type: prerelease
          existing_changelog_path: CHANGELOG.md

  changelog_update:
    name: Changelog update
    needs: [release_prepare]
    permissions:
      contents: write
    uses: apify/workflows/.github/workflows/python_bump_and_update_changelog.yaml@main
    with:
      version_number: ${{ needs.release_prepare.outputs.version_number }}
      changelog_artifact_name: ${{ needs.release_prepare.outputs.changelog_artifact_name }}
    secrets: inherit

  # Publishing runs as a separate workflow run of `publish_to_pypi.yaml` (see the comment there).
  pypi_publish:
    name: PyPI publish
    needs: [release_prepare, changelog_update]
    runs-on: ubuntu-latest
    permissions:
      actions: write # Required by execute-workflow.
    steps:
      - name: Dispatch PyPI publish workflow
        uses: apify/actions/execute-workflow@v1.6.2
        with:
          workflow: publish_to_pypi.yaml
          inputs: >
            {
              "version_number": "${{ needs.release_prepare.outputs.version_number }}",
              "ref": "${{ needs.changelog_update.outputs.changelog_commitish }}",
              "is_prerelease": "true"
            }

  doc_release_post_publish:
    name: Doc release post publish
    needs: [changelog_update, pypi_publish]
    permissions:
      contents: write
      pages: write
      id-token: write
      checks: read
    uses: ./.github/workflows/manual_release_docs.yaml
    secrets: inherit

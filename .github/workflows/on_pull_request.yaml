name: CI (PR)

on:
  # Runs whenever a pull request is opened or updated.
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  pr_title_check:
    name: PR title check
    runs-on: ubuntu-latest
    steps:
      - uses: apify/actions/pr-title-check@48ab27d3d0de7744c20dd783b83245dfae2cddfd # v1.7.0

  checks:
    name: Checks
    uses: ./.github/workflows/_checks.yaml
    secrets: inherit

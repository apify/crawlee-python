name: Release docs

on:
  # Runs when manually triggered from the GitHub UI.
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or ref to build the docs from. If empty, the triggering ref is used.
        required: false
        type: string
        default: ""

  # Runs when invoked by another workflow.
  workflow_call:
    inputs:
      ref:
        description: Commit SHA or ref to build the docs from. If empty, the triggering ref is used.
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  NODE_VERSION: 24
  PYTHON_VERSION: 3.14

jobs:
  release_docs:
    name: Release docs
    environment:
      name: github-pages
    permissions:
      contents: write
      pages: write
      id-token: write
      checks: read
    runs-on: ubuntu-latest

    steps:
      # Gate manual dispatches on the `Checks` workflow already succeeding on this commit (run by `on_master.yaml`);
      # skipped when called from another workflow.
      - name: Wait for checks
        if: github.event_name == 'workflow_dispatch'
        uses: apify/actions/wait-for-checks@v1.4.1
        with:
          ref: ${{ github.sha }}
          check-regexp: '^Checks'

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          token: ${{ secrets.APIFY_SERVICE_ACCOUNT_GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv package manager
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: uv run poe install-dev

      - name: Install pnpm and website dependencies
        uses: apify/actions/pnpm-install@v1.4.1
        with:
          working-directory: website

      - name: Build Docusaurus docs
        run: uv run poe build-docs
        env:
          APIFY_SIGNING_TOKEN: ${{ secrets.APIFY_SIGNING_TOKEN }}
          SEGMENT_TOKEN: ${{ secrets.SEGMENT_TOKEN }}

      - name: Set up GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./website/build

      - name: Deploy artifact to GitHub Pages
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Invalidate CloudFront cache
        run: |
          gh workflow run invalidate-cloudfront.yml \
            --repo apify/apify-docs-private \
            --field deployment=crawlee-web
          echo "✅ CloudFront cache invalidation workflow triggered successfully"
        env:
          GITHUB_TOKEN: ${{ secrets.APIFY_SERVICE_ACCOUNT_GITHUB_TOKEN }}

name: Release docs

on:
  # Runs when manually triggered from the GitHub UI.
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or ref to build the docs from. If empty, the triggering ref is used.
        required: false
        type: string
        default: ""

  # Runs when invoked by another workflow.
  workflow_call:
    inputs:
      ref:
        description: Commit SHA or ref to build the docs from. If empty, the triggering ref is used.
        required: false
        type: string
        default: ""
      skip_checks:
        description: Skip the release branch and `Checks` gate for the built commit. The calling workflows run their own gate.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  NODE_VERSION: 24
  PYTHON_VERSION: 3.14

jobs:
  build_docs:
    name: Build docs
    # Holds only the docs build tokens, so the docs toolchain never runs where the service account token is available.
    environment:
      name: docs
      deployment: false
    permissions:
      contents: read
      checks: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Record the built commit
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # A manual dispatch builds only a commit that is on a release branch and passed the `Checks` workflow (run by
      # `on_master.yaml`). Calling workflows skip both steps through `skip_checks`.
      - name: Check that the commit is on a release branch
        if: ${{ !inputs.skip_checks }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          branches=$(gh api --paginate "repos/$GITHUB_REPOSITORY/branches" --jq '.[].name' | grep -E '^(master|release-v.+)$')
          for branch in $branches; do
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$branch...$SHA" --jq .status || true)
            if [[ "$status" == "identical" || "$status" == "behind" ]]; then
              exit 0
            fi
          done
          echo "::error::$SHA is not on a release branch"
          exit 1

      - name: Wait for checks
        if: ${{ !inputs.skip_checks }}
        uses: apify/actions/wait-for-checks@v1.9.0
        with:
          ref: ${{ steps.sha.outputs.sha }}
          check-regexp: ^Checks

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv package manager
        uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: uv run poe install-dev

      - name: Install pnpm and website dependencies
        uses: apify/actions/pnpm-install@v1.9.0
        with:
          working-directory: website

      - name: Build Docusaurus docs
        run: uv run poe build-docs
        env:
          APIFY_SIGNING_TOKEN: ${{ secrets.APIFY_SIGNING_TOKEN }}
          SEGMENT_TOKEN: ${{ secrets.SEGMENT_TOKEN }}

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./website/build

  deploy_docs:
    name: Deploy docs
    needs: [build_docs]
    environment:
      name: github-pages
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest

    steps:
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Deploy artifact to GitHub Pages
        uses: actions/deploy-pages@v5.0.1

  # The service account token is only used in a job that does not run the docs toolchain.
  invalidate_cloudfront_cache:
    name: Invalidate CloudFront cache
    needs: [deploy_docs]
    environment:
      name: automation
      deployment: false
    permissions: {}
    runs-on: ubuntu-latest

    steps:
      - name: Invalidate CloudFront cache
        run: |
          gh workflow run invalidate-cloudfront.yml \
            --repo apify/apify-docs-private \
            --field deployment=crawlee-web
          echo "✅ CloudFront cache invalidation workflow triggered successfully"
        env:
          GITHUB_TOKEN: ${{ secrets.APIFY_SERVICE_ACCOUNT_GITHUB_TOKEN }}
